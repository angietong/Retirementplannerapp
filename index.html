<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Retirement Financial Planner</title>
    <meta name="description" content="Comprehensive retirement financial planning and simulation tool with income sources, expense modeling, priority-based withdrawal sequencing, tax projections, and depletion forecasting." />
    <meta property="og:title" content="Retirement Financial Planner" />
    <meta property="og:description" content="Comprehensive retirement financial planning and simulation tool with income sources, expense modeling, priority-based withdrawal sequencing, tax projections, and depletion forecasting." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RetirePlan" />
    <script>
      // Safe WebSocket guard for Vite client in iframe / proxy environments
      if (typeof window !== 'undefined' && window.WebSocket) {
        const origSend = window.WebSocket.prototype.send;
        window.WebSocket.prototype.send = function(...args) {
          if (this.readyState === window.WebSocket.OPEN) {
            try {
              return origSend.apply(this, args);
            } catch (err) {
              // Ignore WebSocket send failure in iframe proxy environment
            }
          }
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (e.reason.message?.includes?.('vite') || e.reason.stack?.includes?.('@vite/client') || e.reason.stack?.includes?.('WebSocket'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.filename?.includes?.('@vite/client'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
